espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.11.0"
activityKtx = "1.8.2"
constraintlayout = "2.1.4"
glide = "4.16.0"
swiperefreshlayout = "1.1.0"
documentfile = "1.0.1"
viewpager2 = "1.1.0"
lifecycle = "2.7.0"
